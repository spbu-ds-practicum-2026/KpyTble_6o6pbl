services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: room
      POSTGRES_PASSWORD: room
      POSTGRES_DB: roomdb
    ports:
      - "5432:5432"
    volumes:
      - room_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U room -d roomdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  room-service:
    build: .
    environment:
      ROOM_DATABASE_URL: postgresql+asyncpg://room:room@db:5432/roomdb
      ROOM_HOST_DISCONNECT_GRACE_SECONDS: "10"
      ROOM_EVENT_PUBLISHER: logging
      ROOM_AUTO_CREATE_TABLES: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  room_pgdata:
